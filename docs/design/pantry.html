<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantry home</title><style>
:root{--bg:#f2f4f0;--surface:#fff;--ink:#1a221c;--muted:#5d6a60;--line:#d8ded6;--accent:#2f6b3f;--accent-ink:#fff;--display-fg:#c8e66a;
--ok:#1e7858;--ok-bg:#e1f1e8;--wait:#85600a;--wait-bg:#f8eed3;--err:#b3261e;--err-bg:#fbe9e7;--err-ink:#fff;--line-strong:#7a867c;
--font-display:"Avenir Next Condensed","Bahnschrift SemiCondensed","Bahnschrift","Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
--font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-num:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;color-scheme:light}
/* Dark tokens included so the mock respects system dark mode. --err-ink, --line-strong and the darker light --ok are decided (decisions.md, 2026-11-03; values from docs/reviews/contrast-2026-11-03.md). */
@media (prefers-color-scheme:dark){:root{--bg:#0f140f;--surface:#182019;--ink:#e5ece5;--muted:#9aaa9c;--line:#2a362c;--accent:#7cc48d;--accent-ink:#0c140e;
--ok:#86d6b0;--ok-bg:#163126;--wait:#f0c46a;--wait-bg:#382b0e;--err:#ff8a80;--err-bg:#3b1714;--err-ink:#1a0b0a;--line-strong:#6f7f72;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body)}
.page{padding:24px 16px 64px;max-width:1800px;margin:0 auto}
.page>header{max-width:760px;display:grid;gap:8px;margin-bottom:28px}
.page>header p{margin:0;color:var(--muted)}
.frames{display:flex;flex-wrap:wrap;gap:36px 28px;align-items:flex-start}
figure{margin:0;display:grid;gap:10px;width:390px;max-width:100%}
figcaption{font-size:14px;color:var(--muted)}figcaption b{color:var(--ink);font-family:var(--font-display);font-size:17px;margin-right:6px}
.phone{width:390px;max-width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:640px}
.phone.w320{width:320px}
.scr{padding:16px 16px 28px;display:grid;gap:18px;align-content:start;flex:1}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;margin:0}
h2{font-family:var(--font-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
h3{font-family:var(--font-display);font-size:20px;margin:0}
.eyebrow{font-family:var(--font-display);font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--accent);margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}.hint{color:var(--muted);font-size:14px;margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
button,a.btnlike{font:inherit;cursor:pointer}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 0;color:var(--accent);font-weight:600;text-decoration:none;border:0;background:none}
.save{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font-family:var(--font-display);font-weight:700;font-size:19px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;width:100%}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font-family:var(--font-display);font-weight:700;font-size:18px;background:none;color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:12px 16px;width:100%}
.btn2.danger{color:var(--err);border-color:var(--err)}
.save.danger{background:var(--err);color:var(--err-ink)}
.save:disabled{opacity:.45;cursor:not-allowed}
.small{min-height:44px;font-size:16px;width:auto;padding:8px 14px}
.danger-link{background:none;border:0;color:var(--err);font-weight:600;min-height:44px;padding:0;justify-self:start;display:inline-flex;align-items:center;gap:6px}
label{display:grid;gap:4px;font-size:14px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;width:100%;min-height:46px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tabs.three{grid-template-columns:repeat(3,1fr)}.tabs.four{grid-template-columns:repeat(4,1fr)}
.tab{font-family:var(--font-display);font-weight:700;font-size:17px;background:none;color:var(--muted);border:0;border-radius:8px;min-height:44px;padding:8px 4px}
.tab[aria-selected=true],.tab[aria-pressed=true],.tab[aria-checked=true]{background:var(--accent);color:var(--accent-ink)}
.strip{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.strip .tab{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;font-size:16px}
.strip .tab .ic{width:18px;height:18px}
.optlabel{font-size:14px;font-weight:500;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sw{display:grid;justify-items:center;gap:4px;min-height:64px;padding:6px 2px;background:none;border:1px solid transparent;border-radius:10px;color:var(--ink);font-size:13px;font-weight:600}
.sw i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;border:1px solid rgba(0,0,0,.2)}
.sw[aria-checked=true]{border-color:var(--ink);background:var(--bg)}
.sw .ic{width:18px;height:18px}
.alert{display:flex;gap:10px;background:var(--wait-bg);color:var(--wait);border-radius:10px;padding:12px 14px;font-size:15px;font-weight:500}
.alert.bad{background:var(--err-bg);color:var(--err)}
.alert p{margin:0}
details.how{border-top:1px solid var(--line)}details.how summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;color:var(--ink);font-size:16px;font-weight:500;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.sw-ui{width:50px;height:30px;border-radius:15px;background:var(--line-strong);position:relative;flex:none}
.sw-ui::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .1s}
[aria-checked=true] .sw-ui{background:var(--accent)}[aria-checked=true] .sw-ui::after{left:23px}
.toggle button{all:unset;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;cursor:pointer}
.toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.state{font-size:13px;color:var(--muted);margin-left:auto;margin-right:8px}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arow{display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center;min-height:64px;padding:10px 12px 10px 14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.arow:first-child{border-top:0}
.arow .av{grid-row:1/span 2;width:40px;height:40px;border-radius:12px;background:var(--bg);color:var(--accent);display:grid;place-items:center}
.arow .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.arow .mt{grid-column:2;font-size:14px;color:var(--muted)}
.arow .mt b{font-weight:600;color:var(--ink)}.arow .mt b.over{color:var(--err)}
.arow .ch{grid-column:3;grid-row:1/span 2;color:var(--muted)}
.trow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;min-height:64px;padding:10px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.trow:first-child{border-top:0}
.trow .nm{font-weight:600}.trow .sc{grid-column:1;font-size:14px;color:var(--muted)}
.trow .due{white-space:nowrap;grid-column:2;grid-row:1/span 2;text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.trow .due small{display:block;font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:12px}
.trow .due.over{color:var(--err)}
.trow.over{background:color-mix(in srgb,var(--err-bg) 60%,transparent)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grp summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer}
.grp summary::-webkit-details-marker{display:none}
.grp summary h2{flex:1}.grp summary .cnt{font-size:14px;color:var(--muted);font-weight:600}
.grp summary .ic{transition:transform .15s;color:var(--muted)}.grp[open] summary .ic{transform:rotate(90deg)}
.grp{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip .n{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.chip[aria-pressed=true] .n{color:inherit}
.search{position:relative}.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}.search input{padding-left:42px}
.reading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.reading .v{font-family:var(--font-num);font-size:22px;font-weight:600}.reading .k{font-size:13px;color:var(--muted)}
.empty{display:grid;gap:12px;justify-items:center;text-align:center;padding:28px 16px}
.empty .big{width:72px;height:72px;color:var(--accent)}
.empty p{margin:0}.empty .lead{font-family:var(--font-display);font-size:22px;font-weight:700}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.addgrid .btn2{flex-direction:column;font-size:16px;min-height:76px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line-strong);padding:2px 0 2px 10px;margin:0}
/* Pantry entry + tab bar */
.due{display:grid;gap:8px}
.dbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dbox>.hd{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 14px;font-family:var(--font-display);font-weight:700;font-size:18px}
.dbox>.hd span{font-family:var(--font-body);font-size:14px;color:var(--muted);font-weight:600}
.drow{display:grid;grid-template-columns:22px 1fr auto;gap:0 10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.drow .ic{width:20px;height:20px;color:var(--muted)}.drow small{display:block;color:var(--muted);font-size:13px}
.drow .w{font-weight:600;font-size:14px;text-align:right}.drow .w.over{color:var(--err)}
.tb{margin-top:auto;border-top:1px solid var(--line);background:var(--surface)}
.tb-in{display:grid;grid-template-columns:1.15fr 1px repeat(4,1fr);height:68px;align-items:center}
.tb a{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;min-height:56px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;min-width:0}
.tb a>span:not(.vh){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tb .jar{width:30px;height:30px}
.tb .pansq{width:46px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18);margin-top:-6px}
.tb .pan[aria-current=page]{color:var(--accent)}
.tb .div{width:1px;height:36px;background:var(--line-strong)}
.tb .dot{position:absolute;top:6px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--err);border:2px solid var(--surface)}
.tb.big-text a{font-size:20px}
/* Dialog mock */
.dim{background:color-mix(in srgb,#000 45%,var(--bg))}
.dlg{margin:auto 12px 12px;background:var(--surface);border-radius:18px;padding:20px 18px;display:grid;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dlg h2{color:var(--ink);text-transform:none;letter-spacing:0;font-size:24px}
.dlg ul{margin:0;padding-left:20px;color:var(--ink);font-size:15px}
.steps{display:flex;gap:6px;margin:0;padding:0;list-style:none}.steps li{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps li.on{background:var(--err)}
.mono{font-family:var(--font-num);font-weight:700;letter-spacing:.06em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== Added for pantry / jars / onboarding (system.md). Same tokens as settings-option-c.html ===== */
:root{--display-bg:#141a15;--run:#b5562a}
@media (prefers-color-scheme:dark){:root{--display-bg:#070a07;--run:#ff9a6b}}
svg.ic,svg.jar,svg.big{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big{width:72px;height:72px;color:var(--accent)}
.phone.tall{min-height:780px}
.pend{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--wait);background:var(--wait-bg);border:1px dashed var(--wait);border-radius:6px;padding:2px 8px;width:max-content;max-width:100%;line-height:1.35}
figcaption .pend{margin-top:6px}
/* Due box */
.boxes{display:grid;gap:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.box>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 14px;cursor:pointer}
.box>summary::-webkit-details-marker{display:none}
.box>summary .t{flex:1;display:grid}
.box>summary h2{font-size:19px;letter-spacing:.01em;text-transform:none;color:var(--ink)}
.box>summary .rng{font-size:13px;color:var(--muted)}
.cnt{min-width:30px;height:28px;padding:0 9px;border-radius:14px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.box>summary .chev{color:var(--muted);transition:transform .15s}
.box[open]>summary .chev{transform:rotate(180deg)}
.dl{list-style:none;margin:0;padding:0}
.none{border-top:1px solid var(--line);padding:14px;color:var(--muted);font-size:15px;margin:0}
/* Due row */
.dr{border-top:1px solid var(--line)}
.dr.over{background:color-mix(in srgb,var(--err-bg) 60%,var(--surface))}
.drb{all:unset;box-sizing:border-box;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:0 10px;align-items:center;width:100%;min-height:60px;padding:10px 14px;cursor:pointer}
.drb:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.ji{width:36px;height:36px;border-radius:10px;background:var(--bg);color:var(--accent);display:grid;place-items:center}
.ji .ic{width:20px;height:20px}
.tx{min-width:0;display:grid}.tx b{font-weight:600;overflow-wrap:anywhere}.tx small{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.w{display:grid;justify-items:end;text-align:right;gap:3px;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;max-width:150px}
.w>span[aria-hidden]{display:flex;flex-wrap:wrap;justify-content:flex-end;column-gap:.35em}
.w i{font-style:normal;white-space:nowrap}
.w .ask{color:var(--accent);font-family:var(--font-body)}
.dr.over .w{color:var(--err)}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-body);font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap}
.badge .ic{width:14px;height:14px}
.badge.err{color:var(--err);background:var(--err-bg)}.badge.wait{color:var(--wait);background:var(--wait-bg)}.badge.ok{color:var(--ok);background:var(--ok-bg)}.badge.mut{color:var(--muted);background:var(--bg)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}
.act{min-height:52px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;cursor:pointer}
.act.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act .ic{width:18px;height:18px}
.more{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:10px}
.more p{margin:0;font-size:15px}
.gapm{border-top:1px dashed var(--line-strong);padding:6px 14px;font-size:12px;color:var(--muted);text-align:center;margin:0}
.iconbtn{position:relative}.iconbtn .dot{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--err);border:2px solid var(--surface)}
/* Tab bar states */
.tb .pan{color:var(--muted)}.tb .pan[aria-current=page]{color:var(--accent);font-weight:800}
.tb .pan:not([aria-current]) .pansq{background:var(--surface);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.jar .lid,.jar .body{fill:none}
.tb a[aria-current=page]:not(.pan){color:var(--accent);font-weight:800}
.tb a[aria-current=page] .jar .lid,.tb a[aria-current=page] .jar .body{fill:var(--accent)}
.tb a[aria-current=page] .jar .in{stroke:var(--accent-ink)}
.tb-in.three{grid-template-columns:1.15fr 1px repeat(3,1fr)}
.tb .dot{top:4px;left:calc(50% + 8px);width:12px;height:12px}
/* Overlays */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:2}
.toast{position:absolute;left:12px;right:12px;bottom:80px;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-size:15px;z-index:2}
.toast p{margin:0;flex:1}
.toast button{min-height:44px;min-width:64px;background:none;border:0;color:var(--bg);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
/* Jars */
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 8px;font-family:var(--font-display);font-weight:700;font-size:18px;cursor:pointer}
.bigbtn .ic{width:26px;height:26px}
.thg{background:var(--surface)}.thg+.thg{border-top:1px solid var(--line)}
.thg .arow{border-top:0}
.rd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 12px 66px;font-size:14px;color:var(--muted)}
.rd b{font-family:var(--font-num);color:var(--ink)}
.display{background:var(--display-bg);color:var(--display-fg);border-radius:8px;padding:10px 14px;font-family:var(--font-num);font-variant-numeric:tabular-nums;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:17px}
.display span:nth-child(odd){opacity:.75;font-size:12px;letter-spacing:.06em;text-transform:uppercase;align-self:center}
.display span:nth-child(even){text-align:right;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:grid;gap:2px}.stat .k{font-size:13px;color:var(--muted)}.stat .v{font-family:var(--font-num);font-size:22px;font-weight:600}
.stat.main .v{color:var(--accent);font-size:28px;line-height:1.1}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:16px;border-top:2px solid var(--accent);vertical-align:middle;margin-right:6px}.legend i.run{border-top:3px solid var(--run)}
.lrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;min-height:56px;padding:8px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}.lrow small{color:var(--muted);font-size:14px}.lrow .num{font-family:var(--font-num);font-weight:600;text-align:right;font-size:15px}
textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;width:100%}
.field-err{color:var(--err);font-size:14px;font-weight:600;display:flex;gap:6px;align-items:flex-start;margin:0}
.field-err .ic{width:18px;height:18px}
input[aria-invalid=true]{border-color:var(--err);border-width:2px}
/* Onboarding */
.steps.go li.on{background:var(--accent)}
.pick{display:grid;grid-template-columns:44px 1fr 28px;align-items:center;gap:12px;min-height:76px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);text-align:left;color:var(--ink);font:inherit;width:100%;cursor:pointer}
.pick .ji{width:44px;height:44px}
.pick b{display:block;font-family:var(--font-display);font-size:19px}.pick small{color:var(--muted);font-size:14px;display:block}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent}
.tick .ic{width:18px;height:18px}
.pick[aria-pressed=true]{border:2px solid var(--accent);padding:11px 13px}
.pick[aria-pressed=true] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ck{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border-top:1px solid var(--line);color:var(--ink);font-size:16px;font-weight:400;cursor:pointer}
.ck:first-child{border-top:0}
.ck input{width:24px;height:24px;margin:0;accent-color:var(--accent)}
.ck b{font-weight:600;display:block}.ck small{color:var(--muted);font-size:14px;display:block}
.ldr{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.ldr:first-child{border-top:0}
.ldr .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ldr .top b{font-weight:600}.ldr .top small{color:var(--muted);font-size:13px}
.ldr .in{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ldr .in.two{grid-template-columns:1fr 1fr}
.chip.sm{min-height:44px;font-size:14px;padding:0 12px}
.lede{font-size:17px;margin:0}
.olist{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.olist li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;counter-increment:s}
.olist li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert .ic{flex:none}
.alert.ink{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;min-height:44px;padding:0 4px;cursor:pointer;justify-self:center;text-decoration:underline}
.sumrow{display:flex;justify-content:space-between;gap:12px;min-height:48px;align-items:center;border-top:1px solid var(--line);padding:0 14px}.sumrow:first-child{border-top:0}
.sumrow span{color:var(--muted);font-size:15px}
